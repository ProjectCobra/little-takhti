name: Android app (Play Store release)
# Builds a signed Android App Bundle (.aab) for Google Play.
# Needs four repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the workflow says so and finishes without building. The keystore is never stored in the repo.
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths: ['app/**', '.github/workflows/app-android-release.yml']
permissions:
  contents: read
concurrency: { group: app-android-release, cancel-in-progress: true }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check signing secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice title=No signing key yet::Add the four ANDROID_* secrets (see app/store/PLAY_STORE.md) to build a signed release. Skipping."
          fi
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: '21' }
      - name: Web bundle and sync
        if: env.HAS_KEY == 'true'
        working-directory: app
        run: |
          npm ci
          python3 build_www.py
          npx cap sync android
      - name: Build signed App Bundle
        if: env.HAS_KEY == 'true'
        working-directory: app/android
        env:
          LT_VERSION_CODE: ${{ github.run_number }}
          LT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export LT_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          chmod +x gradlew && ./gradlew bundleRelease --no-daemon -q
          rm -f "$RUNNER_TEMP/upload.jks"
          ls -la app/build/outputs/bundle/release/
      - name: Upload App Bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: little-takhti-release-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
