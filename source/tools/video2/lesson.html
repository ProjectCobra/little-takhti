<!doctype html><html><head><meta charset="utf-8"><style>
__FONTS__
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:'lexend',sans-serif;color:#123B28;position:relative;background:#BFE6FF}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%}
.scene{position:absolute;inset:0;display:none}
.big{font-family:'baloo-2';font-weight:800}
.card{background:#fff;border:4px solid #123B28;border-bottom-width:12px;border-radius:36px;display:flex;align-items:center;justify-content:center}
.tok{font-family:'baloo-2';font-weight:800;font-size:150px;line-height:1;width:190px;height:200px;padding-top:18px}
.chip{font-family:'baloo-2';font-weight:800;font-size:54px;background:#123B28;color:#FFD93B;border-radius:999px;padding:6px 40px 2px;white-space:nowrap}
#cap{position:absolute;left:960px;bottom:34px;transform:translateX(-50%);max-width:1340px;background:#fff;border:4px solid #123B28;border-bottom-width:10px;border-radius:40px;padding:14px 40px 16px;font-weight:600;font-size:46px;line-height:1.3;text-align:center;display:none;z-index:50}
#cap .w{color:#9AA9A0}#cap .w.s{color:#123B28}#cap .w.on{color:#1F7A4C;background:#FFE680;border-radius:12px}
#cap img{width:58px;height:58px;vertical-align:-14px;margin-right:12px}
#wipe{position:absolute;top:-200px;height:1480px;width:900px;background:#FFD93B;border-radius:450px;z-index:90;display:none}
#wipe2{position:absolute;top:-200px;height:1480px;width:900px;background:#1F7A4C;border-radius:450px;z-index:89;display:none}
.opt{width:230px;height:200px;font-family:'baloo-2';font-weight:800;font-size:130px;padding-top:16px}
.opt.wide{height:140px;font-size:64px;padding:10px 24px 0;white-space:nowrap;gap:14px}
.opt .sw{display:inline-block;width:52px;height:52px;border-radius:50%;border:4px solid #123B28;margin-top:-10px;box-shadow:inset -6px -8px 0 rgba(0,0,0,.15),inset 6px 6px 0 rgba(255,255,255,.35)}
.cf{position:absolute;left:0;top:0;width:22px;height:12px;border-radius:3px}
.word{font-family:'baloo-2';font-weight:800;white-space:nowrap;line-height:1}
.tag{font-family:'baloo-2';font-weight:800;font-size:50px;background:#fff;color:#123B28;border:4px solid #123B28;border-bottom-width:9px;border-radius:24px;padding:6px 28px 0;white-space:nowrap}
.hl{background:#FFE680;border-radius:14px;padding:0 8px}
.vb{color:#1D5FD1}.av{color:#1F7A4C}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD93B"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
<linearGradient id="mg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C5E35A"/><stop offset=".6" stop-color="#FFC93B"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
</defs></svg>
<div id="bg" class="scene" style="display:block"></div>
<div id="cap"></div><div id="wipe2"></div><div id="wipe"></div>
<script>
const TL = __TL__;
const AS = __ASSETS__;
const SPEC = __SPEC__;
const LOGO='__LOGO__';
const W_ = 1920, H_ = 1080;
// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,t0,d)=>cl((t-t0)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9;return x<=0?0:x>=1?1:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const EASE={eo,eio,back,lin:x=>x};
const pop=(t,t0,d=.45)=>back(lin(t,t0,d));
const mix=(a,b,k)=>a+(b-a)*k;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const norm=w=>w.toLowerCase().replace(/[^a-z0-9]/g,'');
function L(k){if(!TL.lines[k])throw new Error('no line '+k);return TL.lines[k].start}
function LE(k){if(!TL.lines[k])throw new Error('no line '+k);return TL.lines[k].end}
function M(k){if(!(k in TL.marks))throw new Error('no mark '+k);return TL.marks[k]}
function W(k,word,n=0){if(!TL.lines[k])throw new Error('no line '+k);const ws=TL.lines[k].words.filter(x=>norm(x.w)===word);if(!ws.length)throw new Error('no word '+word+' in '+k);const w=n<0?ws[ws.length+n]:ws[n];if(!w)throw new Error('no word '+word+'#'+n+' in '+k);return w.t}
// time refs: 12.5 | "line" (start) | "line$" (end) | "line.word" | "line.word#2" (third) | "line.word#-1" (last) | "@mark" ; then optional +0.3 / -0.2
function T(x){if(typeof x==='number')return x;const m=/^(@)?([A-Za-z0-9_]+)(?:\.([a-z0-9]+))?(?:#(-?\d+))?(\$)?([+-][\d.]+)?$/.exec(x);if(!m)throw new Error('bad time '+x);
 let v;if(m[1])v=M(m[2]);else if(m[3])v=W(m[2],m[3],m[4]?+m[4]:0);else if(m[5])v=LE(m[2]);else v=L(m[2]);return m[6]?v+(+m[6]):v}
const SFX=[];const sfx=(t,n,g=1,p=1)=>SFX.push([+t.toFixed(3),n,g,p]);
function el(parent,html,cls='a',style=''){const d=document.createElement('div');d.className=cls;if(style)d.style.cssText=style;d.innerHTML=html;parent.appendChild(d);return d}
function P(e,x,y,s=1,r=0,o=1,sx=1,sy=1){e.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s*sx},${s*sy})`;e.style.opacity=o;e.style.visibility=o<=0.001||s<=0.001?'hidden':'visible'}
// ---------- props ----------
// pilot props keep their exact look; everything else: a webp in assets/ or a Fluent Emoji svg from source/img
const PILOT={
 mango:()=>`<img src="${AS.mango}" style="width:150px;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))">`,
 mango2:()=>`<img src="${AS.mango}" style="width:150px;display:block;filter:hue-rotate(-18deg) saturate(1.25) drop-shadow(0 8px 6px rgba(0,0,0,.18))">`,
 kite:()=>`<img src="${AS.kite}" style="width:150px;display:block;filter:drop-shadow(0 10px 8px rgba(0,0,0,.15))">`,
 kite2:()=>`<img src="${AS.kite}" style="width:150px;display:block;filter:hue-rotate(170deg) drop-shadow(0 10px 8px rgba(0,0,0,.15))">`,
 duck:()=>`<img src="${AS.duck}" style="width:170px;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))">`,
 counter:()=>`<img src="${AS.counter}" style="width:118px;display:block;filter:drop-shadow(0 6px 5px rgba(0,0,0,.2))">`,
 counter_g:()=>`<img src="${AS.counter}" style="width:118px;display:block;filter:hue-rotate(75deg) saturate(1.3) brightness(.9) drop-shadow(0 6px 5px rgba(0,0,0,.2))">`,
 qmark:()=>`<div class="big" style="width:120px;height:120px;border-radius:50%;border:6px dashed #FF7A45;color:#FF7A45;font-size:80px;text-align:center;line-height:130px">?</div>`,
};
const TINT={mango2:'hue-rotate(-18deg) saturate(1.25) ',kite2:'hue-rotate(170deg) ',counter_g:'hue-rotate(75deg) saturate(1.3) brightness(.9) '};
function PROP(name,w){
 if(w==null&&PILOT[name])return PILOT[name]();
 if(name.startsWith('art:')){const [a,...args]=name.slice(4).split(':');return uniq(ART[a](w,...args))}
 const base=name.replace(/2$|_g$/,'');const key=(AS[name.replace(/-/g,'_')]?name:base).replace(/-/g,'_');
 if(!AS[key])throw new Error('no prop '+name);
 return `<img src="${AS[key]}" style="width:${w||150}px;display:block;filter:${TINT[name]||''}drop-shadow(0 ${Math.round((w||150)*.05)}px ${Math.round((w||150)*.045)}px rgba(0,0,0,.18))">`}
// ---------- inline art (soft 3D: gradients, highlights, shadows) ----------
let GID=0;
// every inline svg gets its own gradient ids: a url(#id) that points into a hidden scene draws nothing
function uniq(svg){const u='_u'+(GID++);return svg.replace(/id="([^"]+)"/g,`id="$1${u}"`).replace(/url\(#([^)]+)\)/g,`url(#$1${u})`)}
const shade=(c,f)=>{const n=parseInt(c.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=x=>Math.round(f<0?x*(1+f):x+(255-x)*f);return'#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1)};
const ART={
 balloon(w=150,c='#E53935'){const id='b'+(GID++);return `<svg width="${w}" height="${w*1.7}" viewBox="0 0 100 170" style="display:block;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18))"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="${shade(c,.45)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.35)}"/></radialGradient></defs><path d="M50 100 Q47 130 54 150 Q58 160 50 170" fill="none" stroke="#8A8A8A" stroke-width="2"/><path d="M50 4C76 4 94 26 94 52C94 78 72 98 50 100C28 98 6 78 6 52C6 26 24 4 50 4Z" fill="url(#${id})"/><path d="M44 99L56 99L52 107L48 107Z" fill="${shade(c,-.25)}"/><ellipse cx="33" cy="30" rx="9" ry="15" fill="#fff" opacity=".45" transform="rotate(25 33 30)"/></svg>`},
 blob(w=150,c='#E53935'){const id='g'+(GID++);return `<svg width="${w}" height="${w}" viewBox="0 0 100 100" style="display:block;overflow:visible;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${shade(c,.4)}"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.3)}"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#${id})"/><ellipse cx="35" cy="30" rx="13" ry="8" fill="#fff" opacity=".45" transform="rotate(-30 35 30)"/></svg>`},
 arc(w=1200,c='#E53935',i=0){const R=560-i*52,id='r'+(GID++);return `<svg width="${w}" height="${w*0.55}" viewBox="0 0 1200 660" style="display:block;overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,.25)}"/><stop offset="1" stop-color="${shade(c,-.15)}"/></linearGradient></defs><path d="M${600-R} 640 A${R} ${R} 0 0 1 ${600+R} 640" fill="none" stroke="url(#${id})" stroke-width="54" stroke-linecap="round"/><path d="M${600-R+10} 600 A${R-12} ${R-12} 0 0 1 ${600-R*0.3} ${640-R*0.94}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="10" stroke-linecap="round"/></svg>`},
 bin(w=330,c='#E53935'){const id='n'+(GID++);return `<svg width="${w}" height="${w*0.62}" viewBox="0 0 330 205" style="display:block;overflow:visible;filter:drop-shadow(0 14px 10px rgba(0,0,0,.2))"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shade(c,.2)}"/><stop offset="1" stop-color="${shade(c,-.25)}"/></linearGradient></defs><path d="M10 30 L320 30 L292 196 Q290 204 280 204 L50 204 Q40 204 38 196 Z" fill="url(#${id})"/><rect x="0" y="14" width="330" height="34" rx="17" fill="${shade(c,.1)}"/><rect x="18" y="20" width="200" height="9" rx="5" fill="#fff" opacity=".35"/></svg>`},
 island(w=260){return `<svg width="${w}" height="${w*0.6}" viewBox="0 0 260 156" style="display:block;overflow:visible;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))"><ellipse cx="130" cy="128" rx="128" ry="26" fill="#3FA9E0"/><ellipse cx="130" cy="124" rx="100" ry="18" fill="#7CCBF0" opacity=".6"/><path d="M50 122 Q130 70 210 122 Z" fill="#F2D38A"/><path d="M70 120 Q130 86 190 120" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="5"/><path d="M128 108 Q124 70 136 36" fill="none" stroke="#8B5A2B" stroke-width="9" stroke-linecap="round"/><path d="M136 36 Q100 24 84 48 M136 36 Q170 18 188 44 M136 36 Q118 6 96 14 M136 36 Q160 4 176 16" fill="none" stroke="#2E9B4F" stroke-width="14" stroke-linecap="round"/></svg>`},
 word(w,text,c='#123B28',size=110){return `<div class="word" style="font-size:${size}px;color:${c}">${text}</div>`},
 plant(w=760){return PLANT(w)},
 grass(w=300){const id='gr'+(GID++);return `<svg width="${w}" height="${w*.6}" viewBox="0 0 300 180" style="display:block;overflow:visible;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE36E"/><stop offset="1" stop-color="#3E9A3A"/></linearGradient></defs><ellipse cx="150" cy="166" rx="146" ry="14" fill="#5A381E" opacity=".5"/>${[...Array(13)].map((_,i)=>{const x=20+i*21,h=90+((i*37)%60),b=(i%2?1:-1)*(18+i%3*8);return `<path d="M${x-12} 168 Q${x} ${168-h*.6} ${x+b} ${168-h} Q${x+4} ${168-h*.5} ${x+12} 168 Z" fill="url(#${id})"/>`}).join('')}</svg>`},
 sky(w=300){const id='sk'+(GID++);return `<svg width="${w}" height="${w*.75}" viewBox="0 0 300 225" style="display:block;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.18))"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B9BEA"/><stop offset="1" stop-color="#9ED8FF"/></linearGradient></defs><rect width="300" height="225" rx="34" fill="url(#${id})"/><circle cx="225" cy="62" r="30" fill="#FFD93B"/><g fill="#fff"><ellipse cx="95" cy="140" rx="50" ry="26"/><ellipse cx="135" cy="128" rx="38" ry="30"/><ellipse cx="62" cy="150" rx="34" ry="18"/></g><rect x="14" y="12" width="120" height="12" rx="6" fill="#fff" opacity=".3"/></svg>`},
 pond(w=1300){const id='pd'+(GID++);return `<svg width="${w}" height="${w*.28}" viewBox="0 0 1300 364" style="display:block;overflow:visible"><defs><radialGradient id="${id}" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#8FD8FA"/><stop offset=".7" stop-color="#3FA9E0"/><stop offset="1" stop-color="#2380C2"/></radialGradient></defs><ellipse cx="650" cy="190" rx="650" ry="170" fill="#6BBF59"/><ellipse cx="650" cy="182" rx="610" ry="150" fill="url(#${id})"/>${[0,1,2,3,4].map(i=>`<path d="M${230+i*200} ${150+(i%2)*60} q34 -14 68 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>`).join('')}</svg>`},
 soil(w=220){return `<svg width="${w}" height="${w*.62}" viewBox="0 0 220 136" style="display:block;overflow:visible;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))"><defs><linearGradient id="sl${GID}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A87446"/><stop offset="1" stop-color="#6B4426"/></linearGradient></defs><path d="M8 130 Q30 40 110 34 Q190 40 212 130 Z" fill="url(#sl${GID++})"/><ellipse cx="80" cy="80" rx="8" ry="5" fill="#5A381E"/><ellipse cx="140" cy="100" rx="9" ry="5" fill="#5A381E"/><ellipse cx="110" cy="62" rx="7" ry="4" fill="#5A381E"/><path d="M40 70 Q80 44 120 44" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"/></svg>`},
 track(w=1800){return `<svg width="${w}" height="${w*.09}" viewBox="0 0 1800 162" style="display:block;overflow:visible;filter:drop-shadow(0 10px 8px rgba(0,0,0,.15))"><rect x="0" y="20" width="1800" height="122" rx="61" fill="#E9C98F"/><rect x="0" y="20" width="1800" height="30" rx="15" fill="#F6E0B5"/><rect x="1660" y="20" width="26" height="122" fill="#fff"/>${[0,1,2,3,4].map(i=>`<rect x="1660" y="${20+i*24.4}" width="13" height="12.2" fill="#123B28"/><rect x="1673" y="${32.2+i*24.4}" width="13" height="12.2" fill="#123B28"/>`).join('')}</svg>`},
 land(w=3600){return LAND(w)},
};
function PLANT(w){const k=w/760;return `<svg width="${w}" height="${1000*k}" viewBox="0 0 760 1000" style="display:block;overflow:visible">
<defs><linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6A3F"/><stop offset="1" stop-color="#6B4426"/></linearGradient>
<linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3E9A3A"/><stop offset=".45" stop-color="#7DD35E"/><stop offset="1" stop-color="#2F7F2C"/></linearGradient>
<radialGradient id="leaf" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#8FE070"/><stop offset=".7" stop-color="#3FA341"/><stop offset="1" stop-color="#2A7A2C"/></radialGradient>
<radialGradient id="petal" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#FFE45C"/><stop offset=".7" stop-color="#FFC21A"/><stop offset="1" stop-color="#F29A0C"/></radialGradient>
<radialGradient id="seedc" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#9A5A2A"/><stop offset="1" stop-color="#4A2810"/></radialGradient>
<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-opacity=".22"/></filter></defs>
<g class="soil"><rect x="20" y="720" width="720" height="270" rx="40" fill="url(#soil)" filter="url(#ds)"/><rect x="20" y="712" width="720" height="34" rx="17" fill="#7A4F2C"/>
${[[90,800],[200,900],[560,820],[650,930],[420,950],[300,780]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="7" fill="#5A381E" opacity=".6"/>`).join('')}</g>
<g class="roots" fill="none" stroke="#E8D3A8" stroke-linecap="round"><path d="M380 730 Q372 820 330 900 Q310 940 280 960" stroke-width="16"/><path d="M380 730 Q392 830 440 910 Q460 945 500 962" stroke-width="16"/><path d="M380 730 Q382 840 376 960" stroke-width="18"/><path d="M350 850 Q300 860 250 830" stroke-width="9"/><path d="M410 860 Q470 860 520 835" stroke-width="9"/><path d="M372 900 Q340 930 330 970" stroke-width="7"/><path d="M380 730 Q372 820 330 900" stroke="#fff" stroke-opacity=".35" stroke-width="5"/></g>
<g class="stem"><path d="M368 740 Q362 520 380 300 L396 300 Q380 520 392 740 Z" fill="url(#stem)" filter="url(#ds)"/></g>
<g class="leaves" filter="url(#ds)"><path d="M374 600 Q260 520 150 560 Q250 650 374 612 Z" fill="url(#leaf)"/><path d="M374 600 Q270 570 175 560" fill="none" stroke="#2A7A2C" stroke-width="5"/>
<path d="M384 520 Q500 430 620 470 Q520 570 386 532 Z" fill="url(#leaf)"/><path d="M384 524 Q500 480 600 472" fill="none" stroke="#2A7A2C" stroke-width="5"/>
<path d="M378 420 Q290 360 210 390 Q290 450 378 430 Z" fill="url(#leaf)"/></g>
<g class="flower" filter="url(#ds)">${[...Array(14)].map((_,i)=>`<ellipse cx="388" cy="135" rx="34" ry="92" fill="url(#petal)" transform="rotate(${i*360/14} 388 225)"/>`).join('')}<circle cx="388" cy="225" r="82" fill="url(#seedc)"/>${[...Array(26)].map((_,i)=>{const a=i*2.4,r=8+i*2.6;return`<circle cx="${388+Math.cos(a)*r}" cy="${225+Math.sin(a)*r}" r="6" fill="#C8955A" opacity=".8"/>`}).join('')}<ellipse cx="360" cy="190" rx="26" ry="14" fill="#fff" opacity=".18"/></g>
</svg>`}
function LAND(w){const k=w/3600;
 // x: mountains 0-1230 (green valley ~650, K2 peak 960, glacier on its left side), lake 1040, plateau 1260-1690, plain 1650-2350 with a canal, desert 2380-3000, sea 3000-3600 with an island
 return `<svg width="${w}" height="${1080*k}" viewBox="0 0 3600 1080" style="display:block">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC6F2"/><stop offset="1" stop-color="#D8F0FF"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A08C7A"/><stop offset=".5" stop-color="#7A6656"/><stop offset="1" stop-color="#5A4A3E"/></linearGradient>
<linearGradient id="mt2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7A390"/><stop offset="1" stop-color="#7E6A5A"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ED36A"/><stop offset="1" stop-color="#4FA644"/></linearGradient>
<linearGradient id="vgrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CCB5C"/><stop offset="1" stop-color="#3E9440"/></linearGradient>
<linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A26A"/><stop offset=".12" stop-color="#B2864E"/><stop offset="1" stop-color="#8C6338"/></linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D98C"/><stop offset="1" stop-color="#E0B45C"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FA9E0"/><stop offset="1" stop-color="#1C6FB0"/></linearGradient>
<linearGradient id="riv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FD0F5"/><stop offset="1" stop-color="#3FA0E0"/></linearGradient>

// ---------- mascot ----------
function MASCOT(){return `<div style="position:relative;width:380px;height:420px"><img class="tki" src="${AS.tk_idle}" style="position:absolute;left:0;bottom:0;width:380px;filter:drop-shadow(0 14px 10px rgba(0,0,0,.22))"></div>`}
function mascot(parent){const e=el(parent,MASCOT());e.q=s=>e.querySelector(s);return e}
function talkingAt(t){for(const k in TL.lines){const l=TL.lines[k];if(l.speaker!=='T'||t<l.start||t>l.end)continue;for(const w of l.words){if(t>=w.t&&t<=w.t+Math.max(.12,Math.min(w.d,.5)))return Math.sin((t-w.t)*26)>-.1}}return false}
function poseMascot(e,t,o={}){
 const talk=talkingAt(t);const img=e.q('.tki');
 const src=(o.cheer||o.wave)&&!talk?AS.tk_happy:(talk?AS.tk_talk:AS.tk_idle);
 if(img.getAttribute('src')!==src)img.setAttribute('src',src);
 const r=o.wave?Math.sin(t*7)*5:(o.cheer?Math.sin(t*10)*4:(talk?Math.sin(t*9)*1.5:0));
 img.style.transform=`rotate(${r}deg)`;img.style.transformOrigin='50% 100%';
}
function idleBob(t,ph=0){return Math.sin((t+ph)*3.2)*6}
// confetti
const CFC=['#FFD93B','#1F7A4C','#FF7A45','#3B9BD6','#B45BD6','#FF5C8A'];
function confetti(parent,n,seed){const r=rng(seed);const ps=[];for(let i=0;i<n;i++){const d=el(parent,'','cf');d.style.background=CFC[i%CFC.length];ps.push({d,a:r()*Math.PI*2,v:500+r()*900,vr:(r()-.5)*900,up:600+r()*700,ph:r()*6});}return ps}
function confettiU(ps,t,t0,cx,cy){const dt=t-t0;for(const p of ps){if(dt<0||dt>2.6){p.d.style.visibility='hidden';continue}p.d.style.visibility='visible';const x=cx+Math.cos(p.a)*p.v*dt*.8+Math.sin(dt*4+p.ph)*20;const y=cy-p.up*dt+Math.sin(p.a)*p.v*.3*dt+700*dt*dt;p.d.style.transform=`translate(${x}px,${y}px) rotate(${p.vr*dt}deg) scaleX(${Math.cos(dt*8+p.ph)})`;p.d.style.opacity=dt>2?1-(dt-2)/.6:1}}

// TEN FRAME: pairs that make ten
SCN.tenframe=(r,t0,s)=>{
