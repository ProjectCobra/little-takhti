<!doctype html><html><head><meta charset="utf-8"><style>
__FONTS__
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:'lexend',sans-serif;color:#123B28;position:relative;background:#BFE6FF}
.a{position:absolute;left:0;top:0;transform-origin:50% 50%}
.scene{position:absolute;inset:0;display:none}
.big{font-family:'baloo-2';font-weight:800}
.card{background:#fff;border:4px solid #123B28;border-bottom-width:12px;border-radius:36px;display:flex;align-items:center;justify-content:center}
.tok{font-family:'baloo-2';font-weight:800;font-size:150px;line-height:1;width:190px;height:200px;padding-top:18px}
.chip{font-family:'baloo-2';font-weight:800;font-size:54px;background:#123B28;color:#FFD93B;border-radius:999px;padding:6px 40px 2px;white-space:nowrap}
#cap{position:absolute;left:960px;bottom:34px;transform:translateX(-50%);max-width:1340px;background:#fff;border:4px solid #123B28;border-bottom-width:10px;border-radius:40px;padding:14px 40px 16px;font-weight:600;font-size:46px;line-height:1.3;text-align:center;display:none;z-index:50}
#cap .w{color:#9AA9A0}#cap .w.s{color:#123B28}#cap .w.on{color:#1F7A4C;background:#FFE680;border-radius:12px}
#cap img{width:58px;height:58px;vertical-align:-14px;margin-right:12px}
#wipe{position:absolute;top:-200px;height:1480px;width:900px;background:#FFD93B;border-radius:450px;z-index:90;display:none}
#wipe2{position:absolute;top:-200px;height:1480px;width:900px;background:#1F7A4C;border-radius:450px;z-index:89;display:none}
.opt{width:230px;height:200px;font-family:'baloo-2';font-weight:800;font-size:130px;padding-top:16px}
.cf{position:absolute;left:0;top:0;width:22px;height:12px;border-radius:3px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD93B"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
<linearGradient id="mg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C5E35A"/><stop offset=".6" stop-color="#FFC93B"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
</defs></svg>
<div id="bg" class="scene" style="display:block"></div>
<div id="cap"></div><div id="wipe2"></div><div id="wipe"></div>
<script>
const TL = __TL__;
const AS = __ASSETS__;
const W_ = 1920, H_ = 1080;
// ---------- helpers ----------
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,t0,d)=>cl((t-t0)/d);
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.9;return x<=0?0:x>=1?1:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const pop=(t,t0,d=.45)=>back(lin(t,t0,d));
const mix=(a,b,k)=>a+(b-a)*k;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const norm=w=>w.toLowerCase().replace(/[^a-z0-9]/g,'');
function L(k){return TL.lines[k].start}
function LE(k){return TL.lines[k].end}
function M(k){return TL.marks[k]}
function W(k,word,n=0){const ws=TL.lines[k].words.filter(x=>norm(x.w)===word);if(!ws.length)throw new Error('no word '+word+' in '+k);return (n<0?ws[ws.length+n]:ws[n]).t}
const SFX=[];const sfx=(t,n,g=1,p=1)=>SFX.push([+t.toFixed(3),n,g,p]);
function el(parent,html,cls='a',style=''){const d=document.createElement('div');d.className=cls;if(style)d.style.cssText=style;d.innerHTML=html;parent.appendChild(d);return d}
function P(e,x,y,s=1,r=0,o=1,sx=1,sy=1){e.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s*sx},${s*sy})`;e.style.opacity=o;e.style.visibility=o<=0.001||s<=0.001?'hidden':'visible'}
// ---------- art ----------
const MANGO=(g='mg')=>`<img src="${AS.mango}" style="width:150px;display:block;filter:${g==='mg2'?'hue-rotate(-18deg) saturate(1.25) ':''}drop-shadow(0 8px 6px rgba(0,0,0,.18))">`;
const KITE=(c1,c2)=>`<img src="${AS.kite}" style="width:150px;display:block;filter:${c1==='#3B9BD6'?'hue-rotate(170deg) ':''}drop-shadow(0 10px 8px rgba(0,0,0,.15))">`;
const DUCK=`<img src="${AS.duck}" style="width:170px;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.15))">`;
const COUNTER=(green)=>`<img src="${AS.counter}" style="width:118px;display:block;filter:${green?'hue-rotate(75deg) saturate(1.3) brightness(.9) ':''}drop-shadow(0 6px 5px rgba(0,0,0,.2))">`;
function MASCOT(){return `<div style="position:relative;width:380px;height:420px"><img class="tki" src="${AS.tk_idle}" style="position:absolute;left:0;bottom:0;width:380px;filter:drop-shadow(0 14px 10px rgba(0,0,0,.22))"></div>`}
function mascot(parent){const e=el(parent,MASCOT());e.q=s=>e.querySelector(s);return e}
function talkingAt(t){for(const k in TL.lines){const l=TL.lines[k];if(l.speaker!=='T'||t<l.start||t>l.end)continue;for(const w of l.words){if(t>=w.t&&t<=w.t+Math.max(.12,Math.min(w.d,.5)))return Math.sin((t-w.t)*26)>-.1}}return false}
function poseMascot(e,t,o={}){
 const talk=talkingAt(t);const img=e.q('.tki');
 const src=(o.cheer||o.wave)&&!talk?AS.tk_happy:(talk?AS.tk_talk:AS.tk_idle);
 if(img.getAttribute('src')!==src)img.setAttribute('src',src);
 const r=o.wave?Math.sin(t*7)*5:(o.cheer?Math.sin(t*10)*4:(talk?Math.sin(t*9)*1.5:0));
 img.style.transform=`rotate(${r}deg)`;img.style.transformOrigin='50% 100%';
}
function idleBob(t,ph=0){return Math.sin((t+ph)*3.2)*6}
// confetti
const CFC=['#FFD93B','#1F7A4C','#FF7A45','#3B9BD6','#B45BD6','#FF5C8A'];
function confetti(parent,n,seed){const r=rng(seed);const ps=[];for(let i=0;i<n;i++){const d=el(parent,'','cf');d.style.background=CFC[i%CFC.length];ps.push({d,a:r()*Math.PI*2,v:500+r()*900,vr:(r()-.5)*900,up:600+r()*700,ph:r()*6});}return ps}
function confettiU(ps,t,t0,cx,cy){const dt=t-t0;for(const p of ps){if(dt<0||dt>2.6){p.d.style.visibility='hidden';continue}p.d.style.visibility='visible';const x=cx+Math.cos(p.a)*p.v*dt*.8+Math.sin(dt*4+p.ph)*20;const y=cy-p.up*dt+Math.sin(p.a)*p.v*.3*dt+700*dt*dt;p.d.style.transform=`translate(${x}px,${y}px) rotate(${p.vr*dt}deg) scaleX(${Math.cos(dt*8+p.ph)})`;p.d.style.opacity=dt>2?1-(dt-2)/.6:1}}
// ---------- background ----------
const bg=document.getElementById('bg');
bg.innerHTML=`<div class="a" style="width:1920px;height:1080px;background:#9FD8FF"></div>`;
const meadow=el(bg,`<img src="${AS.meadow}" style="width:1920px;height:1080px;display:block">`,'a','transform-origin:50% 60%');
function bgU(t){const z=1.04+0.03*Math.sin(t*0.07);meadow.style.transform=`translate(${Math.sin(t*0.05)*12}px,0) scale(${z})`}
// ---------- scenes ----------
const S=[];
function scene(mark,build){const root=document.createElement('div');root.className='scene';document.body.insertBefore(root,document.getElementById('cap'));const u=build(root,M(mark));S.push({t0:M(mark),root,u});}

// INTRO (3D clip from Canva)
scene('intro',(r,t0)=>{
 const C=TL.clips&&TL.clips.intro;
 const clipW=el(r,`<img class="clip" style="width:1920px;height:1080px;display:block">`,'a');const clip=clipW.firstElementChild;
 const logo=el(r,`<div style="display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.92);padding:10px 26px 10px 12px;border-radius:999px;box-shadow:0 6px 0 rgba(18,59,40,.15)"><img src="__LOGO__" width="64" height="64"><span class="big" style="font-size:52px;color:#123B28">Little Takhti</span></div>`);
 const card=el(r,`<div class="card" style="flex-direction:column;padding:26px 60px 18px;gap:6px"><div class="chip" style="font-size:44px">KG Maths</div><div class="big" style="font-size:150px;line-height:1;white-space:nowrap">Adding to <span style="color:#1F7A4C">10</span></div></div>`);
 const nums=[...Array(10)].map((_,i)=>el(r,`<div class="card big" style="width:96px;height:96px;font-size:60px;padding-top:8px;border-radius:26px;background:${CFC[i%6]};color:#fff;border-color:#123B28">${i+1}</div>`));
 const tToday=L('today'),tTen=W('today','ten');
 sfx(t0+.15,'swoosh');sfx(t0+.45,'sparkle');sfx(tToday+.6,'whoosh');
 nums.forEach((_,i)=>sfx(tTen-.5+i*.08,'pop',.22,1.2+i*.06));
 r.__clip=clip;
 return t=>{
  if(C){const k=Math.max(0,Math.min(C.n-1,Math.floor((t-t0)*30)));const src=C.dir+String(k+1).padStart(4,'0')+'.jpg';if(clip.getAttribute('src')!==src)clip.setAttribute('src',src)}
  P(clipW,960,540,C?1:0);
  P(logo,250,80,pop(t,t0+.2,.5));
  P(card,1180,330,pop(t,tToday+.6,.55));
  nums.forEach((n,i)=>P(n,mix(760,1600,i/9),560+Math.sin(t*3+i)*8,pop(t,tTen-.5+i*.08,.4),Math.sin(t*2+i)*6));
 }});

// STORY
scene('story',(r,t0)=>{
 
 const slots=[[-390,0],[-260,0],[-130,0],[0,0],[130,0],[260,0],[390,0]];
 const BIMG=(cp)=>`<img src="${AS.basket}" style="width:900px;height:380px;display:block;object-fit:fill;clip-path:${cp};filter:drop-shadow(0 18px 14px rgba(0,0,0,.18))">`;
 const basketBack=el(r,BIMG('polygon(0px 0px,900px 0px,900px 127px,855px 152px,810px 162px,765px 168px,720px 173px,675px 177px,630px 180px,585px 182px,540px 183px,495px 184px,450px 184px,405px 184px,360px 183px,315px 182px,270px 180px,225px 177px,180px 173px,135px 168px,90px 162px,45px 152px,0px 127px)'));
 const mangoes=slots.map((_,i)=>el(r,MANGO(i<4?'mg':'mg2')));
 const basketFront=el(r,BIMG('polygon(0px 125px,45px 150px,90px 160px,135px 166px,180px 171px,225px 175px,270px 178px,315px 180px,360px 181px,405px 182px,450px 182px,495px 182px,540px 181px,585px 180px,630px 178px,675px 175px,720px 171px,765px 166px,810px 160px,855px 150px,900px 125px,900px 380px,0px 380px)'));
  const badges=[...Array(7)].map((_,i)=>el(r,`<div class="card big" style="width:92px;height:92px;font-size:60px;padding-top:8px;border-radius:50%;border-bottom-width:8px;background:#FFD93B">${i+1}</div>`));
 const brace4=el(r,`<div class="chip" style="font-size:44px">Nana: 4</div>`);
 const brace3=el(r,`<div class="chip" style="font-size:44px;background:#1F7A4C;color:#fff">Zara: 3</div>`);
 const toks=['4','+','3','=','7'].map((c,i)=>el(r,`<div class="card tok" style="${i===4?'background:#FFD93B':''}${i%2?';border:none;background:none;width:120px':''}">${c}</div>`));
 const m=mascot(r);const cf=confetti(r,70,7);
 const drop=[...['one','two','three','four'].map(w=>W('m4',w)), W('z3','adds')+.15,W('z3','adds')+.5,W('z3','adds')+.85];
 const cnt=['four','five','six','seven'].map(w=>W('count',w));
 const eqT=[W('eq','four'),W('eq','plus'),W('eq','three'),W('eq','makes'),W('eq','seven')];
 drop.forEach(d=>sfx(d+.42,'pop',.6));cnt.forEach((c,i)=>sfx(c,'ding',.45,[1,1.12,1.26,1.5][i]));
 eqT.forEach((c,i)=>sfx(c,'pop',.4,1+i*.1));sfx(eqT[4]+.05,'tada',.6);sfx(L('basket'),'whoosh',.5);
 return t=>{
  const bx=1010,by=600;const bin=eo(lin(t,L('basket')-.2,.6));
  P(basketBack,bx,mix(1450,by+70,bin));P(basketFront,bx,mix(1450,by+70,bin));
  mangoes.forEach((e,i)=>{const d=drop[i];const k=lin(t,d,.42);const tx=bx+slots[i][0]*0.86,ty=by+25-Math.abs(slots[i][0])*0.06+slots[i][1];
   let y=mix(-160,ty,k*k);let s=1;if(k>=1){const b=t-d-.42;y=ty-Math.abs(Math.sin(b*12))*24*Math.exp(-b*7);s=1}
   let glow=1;cnt.forEach((c,j)=>{if(i===j+3){glow+=.28*Math.exp(-Math.pow((t-c-.1)*6,2))}});
   if(i<4){glow+=.18*Math.exp(-Math.pow((t-cnt[0]+.25)*5,2))}
   P(e,tx,y+(k>=1?Math.sin(t*3+i)*3:0),(t<d?0:1.1)*glow,Math.sin(t*2.5+i*1.3)*5)});
  badges.forEach((b,i)=>{let tt=i<3?cnt[0]-.25:cnt[i-3];if(i===3)tt=cnt[0];const k=pop(t,tt,.4);P(b,bx+slots[i][0]*0.86,by-140+slots[i][1],k*(t>eqT[0]-.1?mix(1,.75,lin(t,eqT[0]-.1,.3)):1),0,1-lin(t,eqT[0]+.1,.3)*.0)});
  P(brace4,bx-195,by+290,pop(t,drop[3]+.5)*(1-lin(t,L('howmany'),.3)));P(brace3,bx+260,by+290,pop(t,drop[6]+.5)*(1-lin(t,L('howmany'),.3)));
  const ex=[740,890,1010,1130,1290];toks.forEach((e,i)=>P(e,ex[i]+20,190,pop(t,eqT[i],.45),0));
  confettiU(cf,t,eqT[4]+.05,1300,260);
  P(m,190,820+idleBob(t),.95,0,1);poseMascot(m,t,{cheer:t>eqT[4]&&t<eqT[4]+1.8,point:t>L('count')&&t<LE('count')});
 }});

// HOP
scene('hop',(r,t0)=>{
 const x0=300,dx=132,ly=700;
 const line=el(r,`<svg width="1500" height="60" viewBox="0 0 1500 60"><rect x="10" y="22" width="1480" height="16" rx="8" fill="#123B28"/>${[...Array(11)].map((_,i)=>`<rect x="${50+i*132-5}" y="6" width="10" height="48" rx="5" fill="#123B28"/>`).join('')}</svg>`);
 const nb=[...Array(11)].map((_,i)=>el(r,`<div class="card big" style="width:96px;height:96px;font-size:58px;padding-top:8px;border-radius:50%;border-bottom-width:8px">${i}</div>`));
 const arcs=[0,1,2].map(i=>el(r,`<svg width="150" height="120" viewBox="0 0 150 120"><path d="M8 112Q75 -40 142 112" fill="none" stroke="#FF7A45" stroke-width="8" stroke-dasharray="4 16" stroke-linecap="round"/></svg>`));
 const plus=[0,1,2].map(i=>el(r,`<div class="chip" style="font-size:48px;background:#FF7A45;color:#fff">+1</div>`));
 const m=mascot(r);const cf=confetti(r,60,11);
 const eq=el(r,`<div class="card big" style="font-size:110px;padding:20px 50px 4px;white-space:nowrap">4 + 3 = <span style="color:#1F7A4C">7</span></div>`);
 const title=el(r,`<div class="chip">Hop on the number line</div>`);
 const hs=['one','two','three'].map((w,i)=>W('hop',w,i===2?-1:0)-.05);const tf=W('hop','four');const land=W('land','seven');
 hs.forEach((h,i)=>sfx(h,'boing',.5,1+i*.12));sfx(tf,'ding',.4);sfx(land,'tada',.6);sfx(t0+.2,'pop',.4);
 return t=>{
  P(title,960,170,pop(t,t0+.3));P(line,960,ly,1,0,lin(t,t0+.1,.3));
  nb.forEach((b,i)=>{const on=(i===4&&t>tf)||(i===7&&t>land);b.firstElementChild.style.background=i===7&&t>land?'#FFD93B':i===4&&t>tf?'#C9F0D3':'#fff';P(b,x0+i*dx,ly+90,pop(t,t0+.25+i*.05)*(on?1.12:1))});
  let pos=4,y=ly-150,sq=1;
  for(let i=0;i<3;i++){const k=lin(t,hs[i],.5);if(k>0){pos=4+i+eio(k);if(k<1)y=ly-150-Math.sin(k*Math.PI)*190}}
  const lastk=lin(t,hs[2],.5);
  const inPos=eo(lin(t,t0+.1,.8));const mx=mix(-200,x0+pos*dx,inPos);
  arcs.forEach((a,i)=>{const k=lin(t,hs[i],.5);P(a,x0+(4.5+i)*dx,ly-150-40,k>0?1:0,0,k>0?1:0);a.style.clipPath=`inset(0 ${100-k*100}% 0 0)`});
  plus.forEach((p,i)=>P(p,x0+(4.5+i)*dx,ly-330,pop(t,hs[i]+.2,.4)));
  P(m,mx,y+(t<hs[0]?idleBob(t):0),.6,0,1);poseMascot(m,t,{cheer:t>land});
  P(eq,960,330,pop(t,land,.5));confettiU(cf,t,land,x0+7*dx,ly-120);
 }});

// TEN
scene('ten',(r,t0)=>{
 const fx=960,fy=560,cs=150;
 const frame=el(r,`<div style="width:${cs*5+40}px;height:${cs*2+40}px;background:#fff;border:6px solid #123B28;border-bottom-width:14px;border-radius:34px;display:grid;grid-template-columns:repeat(5,${cs}px);padding:14px;gap:0">${[...Array(10)].map(()=>`<div style="border:3px dashed #BFD3C6;border-radius:24px;margin:6px"></div>`).join('')}</div>`);
 const ctr=[...Array(10)].map(()=>el(r,`<div>${COUNTER(false)}</div>`));const ctrG=[...Array(10)].map(()=>COUNTER(true)),ctrY=COUNTER(false);
 const title=el(r,`<div class="chip">Make 10</div>`);
 const lab=el(r,`<div class="card big" style="font-size:100px;padding:18px 50px 0;white-space:nowrap"></div>`);
 const m=mascot(r);
 const pairs=[['p73',7,3,'seven','three'],['p64',6,4,'six','four'],['p55',5,5,'five','five']].map(([k,a,b,wa,wb])=>{const ta=W(k,wa),tb=W(k,wb,wa===wb?1:0),tt=W(k,'ten');return{k,a,b,ta,tb,tt,s:L(k)}});
 pairs.forEach(p=>{for(let i=0;i<p.a;i++)sfx(p.ta+i*.07,'pop',.25,1+i*.05);for(let i=0;i<p.b;i++)sfx(p.tb+i*.08,'pop',.25,1.4+i*.05);sfx(p.tt,'ding',.5,1.5)});
 sfx(t0+.1,'pop',.4);
 return t=>{
  P(title,960,170,pop(t,t0+.2));P(frame,fx,fy,pop(t,t0+.15,.5));
  let cur=null;for(const p of pairs)if(t>=p.s-.2)cur=p;
  ctr.forEach((c,i)=>{if(!cur){P(c,0,0,0);return}
   const want=i<cur.a?'y':'g';if(c.dataset.k!==want){c.innerHTML=want==='y'?ctrY:ctrG[i];c.dataset.k=want}
   const ts=i<cur.a?cur.ta+i*.07:cur.tb+(i-cur.a)*.08;const k=pop(t,ts,.35);
   const cx=fx-2*cs+(i%5)*cs,cy=fy-cs/2+Math.floor(i/5)*cs+6;
   const glow=t>cur.tt?1+.1*Math.exp(-Math.pow((t-cur.tt-.1-i*.03)*6,2)):1;
   P(c,cx,cy-(1-k)*200,k*glow)});
  if(cur){lab.innerHTML=`${cur.a} + ${cur.b} = <span style="color:#1F7A4C">10</span>`;P(lab,960,880,pop(t,cur.tt,.4)*(t<cur.tt?0:1))}else P(lab,0,0,0);
  P(m,1690,700+idleBob(t),.85,0,1);poseMascot(m,t,{cheer:cur&&t>cur.tt&&t<cur.tt+.9});
 }});

// QUIZ INTRO
scene('quiz',(r,t0)=>{
 const big=el(r,`<div class="big" style="font-size:230px;color:#123B28;white-space:nowrap">Your turn!</div>`);
 const m=mascot(r);sfx(t0+.2,'tada',.5);const cf=confetti(r,80,3);
 return t=>{P(big,960,380,pop(t,t0+.15,.6),Math.sin(t*3)*3);P(m,960,700+idleBob(t)-Math.abs(Math.sin(t*6))*30,1.0,0,1);poseMascot(m,t,{cheer:true});confettiU(cf,t,t0+.2,960,300)}});

// QUESTIONS
function question(id,objs,opts,ans,cd){
 scene(id,(r,t0)=>{
  const panel=el(r,`<div style="width:1640px;height:520px;background:#fff;border:6px solid #123B28;border-bottom-width:16px;border-radius:44px"></div>`);
  const qn=el(r,`<div class="chip">Question ${id.slice(1)}</div>`);
  const items=objs.items.map(o=>el(r,o.html));const plus=objs.plus?el(r,`<div class="big" style="font-size:150px;color:#FF7A45">+</div>`):null;
  const ob=opts.map(v=>el(r,`<div class="card opt">${v}</div>`));
  const ring=el(r,`<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="#fff" stroke="#E3ECE6" stroke-width="22"/><circle class="arc" cx="100" cy="100" r="84" fill="none" stroke="#FF7A45" stroke-width="22" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="528" stroke-dashoffset="0"/><text class="num" x="100" y="128" text-anchor="middle" font-family="baloo-2" font-weight="800" font-size="90" fill="#123B28">5</text></svg>`);
  const cf=confetti(r,90,id.length*31+opts[0]);
